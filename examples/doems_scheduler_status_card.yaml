# Complete optional Scheduler read-only dashboard card.
# Install alongside (not instead of) existing R6 plan editing card.
# R8 and physical execution remain disabled.
type: custom:layout-card
layout_type: custom:grid-layout
layout:
  grid-template-columns: repeat(3, minmax(0, 1fr))
  grid-template-areas: |
    "scheduler scheduler scheduler"
    "slot1 slot2 slot3"
  grid-row-gap: 8px
  grid-column-gap: 8px
cards:
  - type: custom:button-card
    entity: sensor.doems_scheduler_status
    view_layout:
      grid-area: scheduler
    show_icon: true
    icon: mdi:shield-check-outline
    name: "DOEMS · SCHEDULER / SAFETY / PRESTART"
    show_label: true
    show_state: true
    tap_action:
      action: more-info
    label: |
      [[[
        const a = entity?.attributes || {};
        const slot = a.selected_slot ?? '—';
        const safety = String(a.safety_status || 'not_required').replaceAll('_', ' ');
        const prestart = String(a.prestart_status || 'not_required').replaceAll('_', ' ');
        const blockers = [...(a.safety_blockers || []), ...(a.prestart_blockers || [])];
        return 'Selectie: ' + slot + ' · Safety: ' + safety + ' · Prestart: ' + prestart +
          (blockers.length ? ' · Blockers: ' + blockers.join(', ') : ' · Geen blockers') +
          ' · Fysieke uitvoering: UIT';
      ]]]
    styles:
      card:
        - min-height: 116px
        - background: rgba(17,38,54,0.78)
        - border: 1px solid rgba(0,229,255,0.22)
        - border-radius: 18px
        - padding: 14px
      name:
        - color: "#FFFFFF"
        - font-size: 14px
        - font-weight: 800
      state:
        - color: "#00E5FF"
        - font-size: 22px
        - font-weight: 800
      label:
        - color: "#A5BACD"
        - font-size: 11px
        - white-space: normal
      icon:
        - color: "#00E5FF"
        - width: 26px
  - type: custom:button-card
    entity: sensor.doems_plan_1_status
    view_layout:
      grid-area: slot1
    name: "Plan 1"
    show_icon: false
    show_state: true
    show_label: true
    tap_action:
      action: more-info
    label: |
      [[[
        const a = entity?.attributes || {};
        return (a.origin === 'automatic_72h_planner' ? 'Automatisch' : 'Handmatig') +
          ' · ' + (a.action || 'geen') + ' · ' + (a.start_time || '—') +
          ' · ' + (a.power_w ?? '—') + ' W';
      ]]]
    styles:
      card:
        - min-height: 110px
        - background: rgba(17,38,54,0.78)
        - border-radius: 18px
        - border: 1px solid rgba(0,229,255,0.16)
        - padding: 12px
      name:
        - color: "#FFFFFF"
        - font-size: 16px
      state:
        - color: "#00E5FF"
        - font-size: 18px
      label:
        - color: "#A5BACD"
        - white-space: normal
        - font-size: 11px
