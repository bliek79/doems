title: DOEMS Solar Freeze
views:
  - title: Alpha41 Solar Freeze
    path: alpha41-solar-freeze
    icon: mdi:snowflake-check
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Alpha41 Solar Reference Freeze
            heading_style: title
            icon: mdi:snowflake-check
          - type: markdown
            content: >-
              Deze view maakt één immutable referentiesnapshot van de bestaande Alpha41 Solar-runtime.
              Alpha41 zelf wordt niet gewijzigd. Google Sheets blijft read-only. Controleer eerst dat de
              freeze-status **ready** is; druk daarna één keer op **Maak Solar Freeze**.
          - type: entities
            title: Freeze gate
            show_header_toggle: false
            entities:
              - entity: binary_sensor.doems_alpha41_solar_freeze_captured
                name: Freeze vastgelegd
              - type: attribute
                entity: binary_sensor.doems_alpha41_solar_freeze_captured
                attribute: freeze_status
                name: Freeze status
              - type: attribute
                entity: binary_sensor.doems_alpha41_solar_freeze_captured
                attribute: blockers
                name: Blockers
              - type: attribute
                entity: binary_sensor.doems_alpha41_solar_freeze_captured
                attribute: reference_release
                name: Alpha41 release
              - type: attribute
                entity: binary_sensor.doems_alpha41_solar_freeze_captured
                attribute: reference_commit
                name: Referentiecommit
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.doems_alpha41_solar_freeze_captured
                state: "off"
            card:
              type: button
              entity: button.doems_capture_alpha41_solar_freeze
              name: Maak Solar Freeze
              icon: mdi:snowflake-check
              show_state: true
              tap_action:
                action: perform-action
                perform_action: button.press
                target:
                  entity_id: button.doems_capture_alpha41_solar_freeze
                confirmation:
                  text: >-
                    Deze actie legt één immutable Alpha41 Solar referentiesnapshot vast en kan via dit dashboard niet worden overschreven. Doorgaan?
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.doems_alpha41_solar_freeze_captured
                state: "on"
            card:
              type: entities
              title: Vastgelegde freeze
              show_header_toggle: false
              entities:
                - type: attribute
                  entity: binary_sensor.doems_alpha41_solar_freeze_captured
                  attribute: snapshot_id
                  name: Snapshot ID
                - type: attribute
                  entity: binary_sensor.doems_alpha41_solar_freeze_captured
                  attribute: captured_at_local
                  name: Capture lokaal
                - type: attribute
                  entity: binary_sensor.doems_alpha41_solar_freeze_captured
                  attribute: captured_at_utc
                  name: Capture UTC
                - type: attribute
                  entity: binary_sensor.doems_alpha41_solar_freeze_captured
                  attribute: timeline_slot_count
                  name: Slots
                - type: attribute
                  entity: binary_sensor.doems_alpha41_solar_freeze_captured
                  attribute: timeline_sha256
                  name: Timeline SHA256
                - type: attribute
                  entity: binary_sensor.doems_alpha41_solar_freeze_captured
                  attribute: sheets_anchor_status
                  name: Sheets tijdanker
      - type: grid
        cards:
          - type: heading
            heading: Live Alpha41 bron en model
            heading_style: subtitle
            icon: mdi:solar-power-variant-outline
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.do_solar_status
                name: Solar status
              - entity: sensor.do_solar_model
                name: Solar model
              - type: attribute
                entity: sensor.do_solar_status
                attribute: provider
                name: Provider
              - type: attribute
                entity: sensor.do_solar_status
                attribute: last_successful_update
                name: Laatste bronupdate
              - type: attribute
                entity: sensor.do_solar_status
                attribute: age_minutes
                name: Leeftijd bron
              - type: attribute
                entity: sensor.do_solar_status
                attribute: last_error
                name: Laatste fout
          - type: entities
            title: Modelconfiguratie
            show_header_toggle: false
            entities:
              - type: attribute
                entity: sensor.do_solar_model
                attribute: source_variable
                name: Bronvariabele
              - type: attribute
                entity: sensor.do_solar_model
                attribute: source_timezone
                name: Brontijdzone
              - type: attribute
                entity: sensor.do_solar_model
                attribute: north
                name: Noord
              - type: attribute
                entity: sensor.do_solar_model
                attribute: south
                name: Zuid
              - type: attribute
                entity: sensor.do_solar_model
                attribute: calculation
                name: Berekening
      - type: grid
        cards:
          - type: heading
            heading: Native 72h / 288-slot contract
            heading_style: subtitle
            icon: mdi:timeline-clock-outline
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.do_solar_forecast_timeline
                name: Timeline
              - type: attribute
                entity: sensor.do_solar_forecast_timeline
                attribute: resolution_minutes
                name: Resolutie
              - type: attribute
                entity: sensor.do_solar_forecast_timeline
                attribute: horizon_hours
                name: Horizon
              - type: attribute
                entity: sensor.do_solar_forecast_timeline
                attribute: point_count
                name: Punten
              - type: attribute
                entity: sensor.do_solar_forecast_timeline
                attribute: source_buffer_point_count
                name: Bronbuffer
              - type: attribute
                entity: sensor.do_solar_forecast_timeline
                attribute: forecast_start
                name: Start
              - type: attribute
                entity: sensor.do_solar_forecast_timeline
                attribute: forecast_end
                name: Einde
              - type: attribute
                entity: sensor.do_solar_forecast_timeline
                attribute: point_format
                name: Point format
              - type: attribute
                entity: sensor.do_solar_forecast_timeline
                attribute: interval_semantics
                name: Intervalsemantiek
      - type: grid
        cards:
          - type: heading
            heading: Actual en forecast snapshot
            heading_style: subtitle
            icon: mdi:solar-panel
          - type: entities
            title: Actual power
            show_header_toggle: false
            entities:
              - entity: sensor.do_solar_actual_power_north
                name: Noord
              - entity: sensor.do_solar_actual_power_south
                name: Zuid
              - entity: sensor.do_solar_actual_power_total
                name: Totaal
          - type: entities
            title: Next quarter
            show_header_toggle: false
            entities:
              - entity: sensor.do_solar_forecast_next_quarter
                name: Totaal
              - type: attribute
                entity: sensor.do_solar_forecast_next_quarter
                attribute: start
                name: Start
              - type: attribute
                entity: sensor.do_solar_forecast_next_quarter
                attribute: north_kwh
                name: Noord
              - type: attribute
                entity: sensor.do_solar_forecast_next_quarter
                attribute: south_kwh
                name: Zuid
          - type: entities
            title: Vandaag
            show_header_toggle: false
            entities:
              - entity: sensor.do_solar_forecast_today_north
                name: Noord
              - entity: sensor.do_solar_forecast_today_south
                name: Zuid
              - entity: sensor.do_solar_forecast_today_total
                name: Totaal
          - type: entities
            title: Morgen
            show_header_toggle: false
            entities:
              - entity: sensor.do_solar_forecast_tomorrow_north
                name: Noord
              - entity: sensor.do_solar_forecast_tomorrow_south
                name: Zuid
              - entity: sensor.do_solar_forecast_tomorrow_total
                name: Totaal
