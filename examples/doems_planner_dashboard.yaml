      - type: custom:button-card
        entity: sensor.doems_combined_planner
        view_layout:
          grid-area: balance
        show_icon: false
        show_name: false
        show_state: false
        show_label: false
        tap_action:
          action: more-info
        styles:
          card:
            - height: 500px
            - border-radius: 20px
            - padding: 12px
