            - background: |-
                radial-gradient(
                  circle at top left,
                  rgba(80,190,255,0.13),
                  transparent 42%
                ),
                rgba(17,38,54,0.78)
            - border: 1px solid rgba(0,229,255,0.22)
            - box-shadow: inset 0 0 18px rgba(0,229,255,0.04)
          grid:
            - grid-template-areas: '"content"'
            - grid-template-columns: 1fr
            - grid-template-rows: 1fr
          custom_fields:
            content:
              - width: 100%
              - height: 100%
        custom_fields:
          content: |
            [[[
              const plan =
                entity &&
                entity.attributes &&
                Array.isArray(entity.attributes.plan)
                  ? entity.attributes.plan
                  : [];

              if (plan.length === 0) {
                return `
                  <div style="
                    height:100%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#8FA6BD;
                    font-size:12px;
                    font-weight:700;
                  ">
                    Geen Combined Planner-data beschikbaar
                  </div>
                `;
              }

              const sorted = [...plan]
                .filter(item => {
                  const t =
                    new Date(item.time).getTime();

                  return Number.isFinite(t);
                })
                .sort((x, y) => {
                  return (
                    new Date(x.time).getTime() -
                    new Date(y.time).getTime()
                  );
                });

              const keyForDate = date => {
                const y = date.getFullYear();

                const m =
                  String(
                    date.getMonth() + 1
                  ).padStart(2, '0');

                const d =
                  String(
                    date.getDate()
                  ).padStart(2, '0');

                return `${y}-${m}-${d}`;
              };

              const days = {};

              const createDay = (
                key,
                date
              ) => ({
                key: key,
                date: date,
                hours: 0,

                home: 0,
                homeCount: 0,

                solar: 0,
                solarCount: 0,

                direct: 0,
                directCount: 0,

                chargeSolar: 0,
                chargeSolarCount: 0,

                chargeGrid: 0,
                chargeGridCount: 0,

                dischargeHome: 0,
                dischargeHomeCount: 0,

                dischargeGrid: 0,
                dischargeGridCount: 0,

                socEnd: null,
                lastTimestamp: null
              });

              const addValue = (
                day,
                value,
                sumKey,
                countKey
              ) => {
                const n = Number(value);

                if (!Number.isFinite(n))
                  return;

                day[sumKey] += n;
                day[countKey] += 1;
              };

              for (const item of sorted) {

                const timestamp =
                  new Date(item.time).getTime();

                if (!Number.isFinite(timestamp))
                  continue;

                const date =
                  new Date(timestamp);

                const key =
                  keyForDate(date);

                if (!days[key]) {
                  days[key] =
                    createDay(
                      key,
                      date
                    );
                }

                const day =
                  days[key];

                day.hours += 1;

                addValue(
                  day,
                  item.home_consumption_kwh,
                  'home',
                  'homeCount'
                );

                addValue(
                  day,
                  item.solar_kwh,
                  'solar',
                  'solarCount'
                );

                addValue(
                  day,
                  item.solar_to_home_kwh,
                  'direct',
                  'directCount'
                );

                addValue(
                  day,
                  item.charge_from_solar_kwh,
                  'chargeSolar',
                  'chargeSolarCount'
                );

                const safety =
                  Number(
                    item.charge_from_grid_safety_kwh
                  );

                const trade =
                  Number(
                    item.charge_from_grid_trade_kwh
                  );

                if (
                  Number.isFinite(safety) &&
                  Number.isFinite(trade)
                ) {
                  day.chargeGrid +=
                    safety + trade;

                  day.chargeGridCount += 1;
                }

                addValue(
                  day,
                  item.discharge_to_home_kwh,
                  'dischargeHome',
                  'dischargeHomeCount'
                );

                addValue(
                  day,
                  item.discharge_to_grid_kwh,
                  'dischargeGrid',
                  'dischargeGridCount'
                );

                const soc =
                  Number(item.soc_end);

                if (Number.isFinite(soc)) {
                  if (
                    day.lastTimestamp === null ||
                    timestamp >= day.lastTimestamp
                  ) {
                    day.socEnd = soc;
                    day.lastTimestamp = timestamp;
                  }
                }
              }

              const daily =
                Object.values(days)
                  .sort((a, b) => {
                    return (
                      a.date.getTime() -
                      b.date.getTime()
                    );
                  });

              const fmtEnergy = (
                value,
                count
              ) => {

                if (
                  !Number.isFinite(value) ||
                  count === 0
                )
                  return '—';

                return value.toLocaleString(
                  'nl-NL',
                  {
                    minimumFractionDigits: 3,
                    maximumFractionDigits: 3
                  }
                );
              };

              const fmtSoc = value => {

                if (!Number.isFinite(value))
                  return '—';

                return value.toLocaleString(
                  'nl-NL',
                  {
                    minimumFractionDigits: 1,
                    maximumFractionDigits: 1
                  }
                ) + '%';
              };

              const headerCell = (
                label,
                color = '#8FA6BD'
              ) => `
                <div style="
                  min-width:0;
                  text-align:center;
                  font-size:7px;
                  line-height:1.15;
                  font-weight:850;
                  letter-spacing:.02em;
                  color:${color};
                  white-space:normal;
                ">
                  ${label}
                </div>
              `;

              const valueCell = (
                value,
                color
              ) => `
                <div style="
                  min-width:0;
                  text-align:center;
                  font-size:9px;
                  line-height:1.15;
                  font-weight:800;
                  color:${color};
                  white-space:nowrap;
                ">
                  ${value}
                </div>
              `;

              const rows =
                daily.map(day => {

                  const dayLabel =
                    day.date.toLocaleDateString(
                      'nl-NL',
                      {
                        weekday:'short',
                        day:'2-digit',
                        month:'2-digit'
                      }
                    );

                  return `
                    <div style="
                      display:grid;
                      grid-template-columns:
                        76px
                        repeat(8,minmax(0,1fr));
                      align-items:center;
                      min-height:66px;
                      padding:7px 4px;
                      border-radius:12px;
                      background:
                        rgba(5,18,32,0.64);
                      border:
                        1px solid
                        rgba(120,200,255,0.14);
                    ">

                      <div style="
                        padding-left:5px;
                        min-width:0;
                      ">

                        <div style="
                          color:#FFFFFF;
                          font-size:10px;
                          font-weight:850;
                          white-space:nowrap;
                        ">
                          ${dayLabel}
                        </div>

                        <div style="
                          margin-top:3px;
                          color:#70869C;
                          font-size:8px;
                          font-weight:700;
                        ">
                          ${day.hours} uur
                        </div>

                      </div>

                      ${valueCell(
                        fmtEnergy(
                          day.home,
                          day.homeCount
                        ),
                        '#FFFFFF'
                      )}

                      ${valueCell(
                        fmtEnergy(
                          day.solar,
                          day.solarCount
                        ),
                        '#FFD600'
                      )}

                      ${valueCell(
                        fmtEnergy(
                          day.direct,
                          day.directCount
                        ),
                        '#5EEBFF'
                      )}

                      ${valueCell(
                        fmtEnergy(
                          day.chargeSolar,
                          day.chargeSolarCount
                        ),
                        '#00C853'
                      )}

                      ${valueCell(
                        fmtEnergy(
                          day.chargeGrid,
                          day.chargeGridCount
                        ),
                        '#60A5FA'
                      )}

                      ${valueCell(
                        fmtEnergy(
                          day.dischargeHome,
                          day.dischargeHomeCount
                        ),
                        '#00E5FF'
                      )}

                      ${valueCell(
                        fmtEnergy(
                          day.dischargeGrid,
                          day.dischargeGridCount
                        ),
                        '#B86CFF'
                      )}

                      ${valueCell(
                        fmtSoc(day.socEnd),
                        '#FF8A00'
                      )}

                    </div>
                  `;
                })
                .join('');

              return `
                <div style="
                  width:100%;
                  height:100%;
                  display:flex;
                  flex-direction:column;
                  gap:7px;
                ">

                  <div style="
                    height:46px;
                    flex:0 0 46px;
                    display:flex;
                    align-items:center;
                    justify-content:space-between;
                    padding:0 10px;
                    border-radius:14px;
                    background:
                      rgba(0,229,255,0.075);
                    border:
                      1px solid
                      rgba(0,229,255,0.24);
                  ">

                    <div>

                      <div style="
                        color:#FFFFFF;
                        font-size:14px;
                        font-weight:900;
                      ">
                        Combined Planner dagbalans
                      </div>

                      <div style="
                        margin-top:2px;
                        color:#8FA6BD;
                        font-size:8px;
                        font-weight:700;
                      ">
                        Lokale kalenderdagen · zelfde Combined Planner-bron
                      </div>

                    </div>

                    <ha-icon
                      icon="mdi:table-clock"
                      style="
                        width:21px;
                        height:21px;
                        color:#00E5FF;
                      ">
                    </ha-icon>

                  </div>

                  <div style="
                    display:grid;
                    grid-template-columns:
                      76px
                      repeat(8,minmax(0,1fr));
                    align-items:end;
                    min-height:45px;
                    padding:0 4px 5px 4px;
                    border-bottom:
                      1px solid
                      rgba(120,200,255,0.18);
                  ">

                    ${headerCell(
                      'DAG',
                      '#FFFFFF'
                    )}

                    ${headerCell(
                      'WONING<br>kWh',
                      '#FFFFFF'
                    )}

                    ${headerCell(
                      'ZON<br>kWh',
                      '#FFD600'
                    )}

                    ${headerCell(
                      'DIRECT<br>kWh',
                      '#5EEBFF'
                    )}

                    ${headerCell(
                      'LADEN<br>ZON',
                      '#00C853'
                    )}

                    ${headerCell(
                      'LADEN<br>NET',
                      '#60A5FA'
                    )}

                    ${headerCell(
                      'ONTL.<br>WONING',
                      '#00E5FF'
                    )}

                    ${headerCell(
                      'ONTL.<br>NET',
                      '#B86CFF'
                    )}

                    ${headerCell(
                      'SOC<br>EINDE',
                      '#FF8A00'
                    )}

                  </div>

                  <div style="
                    flex:1;
                    min-height:0;
                    display:flex;
                    flex-direction:column;
                    gap:6px;
                    overflow:hidden;
                  ">
                    ${rows}
                  </div>

                  <div style="
                    flex:0 0 27px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    border-radius:9px;
                    background:
                      rgba(5,18,32,0.50);
                    color:#70869C;
                    font-size:8px;
                    font-weight:700;
                  ">
                    Laden net = veiligheid + handel · handmatige plannen apart in grafiek
                  </div>

                </div>
              `;
            ]]]