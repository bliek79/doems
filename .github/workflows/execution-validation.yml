name: DOEMS Execution Validation
on:
  pull_request:
    paths:
      - "custom_components/doems/execution_*.py"
      - "custom_components/doems/sensor.py"
      - "custom_components/doems/__init__.py"
      - "tests/test_execution_model.py"
      - ".github/workflows/execution-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execution-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q custom_components/doems
      - run: pytest -q tests/test_execution_model.py
      - run: pytest -q
