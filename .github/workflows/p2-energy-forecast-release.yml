name: DOEMS CI and Alpha38 Design C Release

on:
  pull_request:
  push:
    branches:
      - main
      - alpha38-split-reserve-safety-reachability
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - name: Compile integration
        run: python -m compileall -q custom_components/doems
      - name: Frozen Alpha76 source parity guard
        run: pytest -q tests/test_alpha32_full_anker_alpha76_parity.py
      - name: Alpha33 runtime serialization adapter regression
        run: pytest -q tests/test_alpha33_runtime_serialization_adapter.py
      - name: Alpha34 verified setpoint handoff regression
        run: pytest -q tests/test_alpha34_verified_setpoint_handoff_adapter.py
      - name: Alpha35 sequential safety exception regression
        run: pytest -q tests/test_alpha35_sequential_safety_exception.py
      - name: Alpha38 Design C policy and runtime regression
        run: pytest -q tests/test_alpha36_best_of_both.py
      - name: Alpha76 planner foundation and Alpha35 exception
        run: pytest -q tests/test_alpha31_exact_anker_planner_parity.py
      - name: Execution and restart parity
        run: pytest -q tests/test_alpha23_execution_naming_cleanup.py tests/test_alpha26_step15a_manual_physical_execution.py tests/test_alpha27_beta2_automatic_plan72_cutover.py tests/test_alpha29_signature_warning_physical_parity.py tests/test_step12_3_final_revalidation_mode_switch_preview.py tests/test_step12_4_automatic_execution_gate.py tests/test_step12_5_execution_controller.py tests/test_step12_6_restart_recovery_observability.py
      - name: Planner Scheduler Safety regression
        run: pytest -q tests/test_alpha8_ems_plans_foundation.py tests/test_step11_safety_prestart_contract.py tests/test_step12_1_control_path_contract.py tests/test_step12_2_action_handoff_contract.py tests/test_plan72_observability_parity.py
      - name: Forecast Prices Foundation regression
        run: pytest -q tests/test_alpha5_1_hotfix_contract.py tests/test_alpha5_2_status_hotfix_contract.py tests/test_alpha6_solar_p31_release_contract.py tests/test_alpha7_prices_release_contract.py tests/test_energy_forecast_contract.py tests/test_foundation_contract.py tests/test_alpha21_multirate_runtime.py tests/test_alpha25_solar_array_performance.py tests/test_ems_config_validation.py tests/test_ems_settings_contract.py tests/test_presence_runtime_contract.py tests/test_prices_p4_contract.py tests/test_recorder_attribute_budget.py tests/test_solar_actual_quarter_validation.py tests/test_solar_forecast_model.py tests/test_solar_foundation_contract.py tests/test_solar_p31_runtime_contract.py tests/test_step5a_consumer_wiring_part1.py tests/test_step5a_forecast_diagnostics.py tests/test_step5a_prices_76h_window_fix.py
      - name: Full pytest
        run: pytest -q
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components/doems").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid: {path}")
          PY
      - name: Validate Alpha38 candidate contract
        run: |
          test -f RELEASE_NOTES_0.1.0-alpha.38.md
          grep -F 'VERSION = "0.1.0-alpha.38"' custom_components/doems/const.py
          grep -F '"version": "0.1.0-alpha.38"' custom_components/doems/manifest.json
          test -f custom_components/doems/ems_alpha36/energy_need.py
          test -f custom_components/doems/ems_alpha36/planner_preview.py
          test -f custom_components/doems/ems_alpha36/planner_72h.py
          test -f custom_components/doems/ems_alpha36/sequential_safety.py
          test -f custom_components/doems/ems_alpha36_adapter.py
          grep -F 'alpha80_cheapest_energy_safety_v1' custom_components/doems/ems_alpha36_adapter.py
          grep -F 'doems_alpha38_split_reserve_safety_reachability_v1' custom_components/doems/ems_alpha36_adapter.py
          grep -F 'doems_alpha38_split_reserve_safety_reachability_v1' custom_components/doems/ems_alpha36/planner_72h.py
          grep -F 'fixed_operational_reserve_v1' custom_components/doems/ems_alpha36/sequential_safety.py
          grep -F 'split_reserve_safety_reachability_v1' custom_components/doems/ems_alpha36/sequential_safety.py
          grep -F 'safety_target_soc' custom_components/doems/ems_alpha36/sequential_safety.py
          grep -F 'precharge_protection_soc' custom_components/doems/ems_alpha36/sequential_safety.py
          grep -F 'from .ems_alpha36_adapter import SOURCE_TAG, planner_reference, run_ems_chain' custom_components/doems/ems_multirate.py
          grep -F 'alpha38_multirate_runtime_v1' custom_components/doems/ems_multirate.py
          grep -F 'self._planner_active_signature' custom_components/doems/ems_runtime.py
          grep -F 'self._planner_pending_request' custom_components/doems/ems_runtime.py
          grep -F 'self._request_planner_refresh("start_critical")' custom_components/doems/ems_runtime.py
          grep -F 'RestoreEntity' custom_components/doems/switch.py
          grep -F 'previous.attributes.get("mode") == "live_guarded"' custom_components/doems/switch.py
          grep -F 'planned_energy_reached' custom_components/doems/ems_execution.py
          grep -F 'abs(actual_setpoint - expected_power) > 10' custom_components/doems/ems_execution.py
          grep -F 'self.execution.evaluate_final_revalidation(' custom_components/doems/ems_runtime.py
          grep -F 'self.execution.evaluate_mode_switch_transaction(' custom_components/doems/ems_runtime.py
          ! grep -F 'DOEMSManualPhysicalExecution' custom_components/doems/ems_runtime.py
          test -f custom_components/doems/ems_physical_test.py
          test -f tests/test_alpha32_full_anker_alpha76_parity.py
          test -f tests/test_alpha33_runtime_serialization_adapter.py
          test -f tests/test_alpha34_verified_setpoint_handoff_adapter.py
          test -f tests/test_alpha35_sequential_safety_exception.py
          test -f tests/test_alpha36_best_of_both.py
          test -f custom_components/doems/ems_alpha76/planner_72h_sequential_safety.py
          grep -F 'alpha34_verified_physical_setpoint_handoff_v1' custom_components/doems/ems_runtime.py
          grep -F 'alpha35_sequential_safety_exception_v1' custom_components/doems/ems_alpha76_adapter.py
          grep -F 'doems_sequential_safety_exception_v1' custom_components/doems/ems_alpha76/planner_72h_sequential_safety.py
          grep -F '_PLATFORM_SETPOINT_HANDOFF_TOLERANCE_W = 10.0' custom_components/doems/ems_runtime.py
          grep -F 'self._state_publish_lock = asyncio.Lock()' custom_components/doems/ems_runtime.py
          grep -F 'alpha33_alpha76_serialized_coordinator_v1' custom_components/doems/ems_runtime.py
          test "$(git hash-object custom_components/doems/brand/icon.png)" = "fb0dd2dee9b6c7074da8bdde0f5663260677c779"


  publish-alpha37:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Alpha38 release archive
        run: |
          zip -r doems.zip custom_components/doems examples LICENSE README.md hacs.json RELEASE_NOTES_0.1.0-alpha.38.md
          sha256sum doems.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Verify Alpha38 planner and parity files are packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_alpha36/energy_need.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_alpha36/planner_preview.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_alpha36/planner_72h.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_alpha36/sequential_safety.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_alpha36_adapter.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_alpha76/energy_need.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_alpha76/planner_preview.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_alpha76/planner_72h.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_alpha76/planner_72h_sequential_safety.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_planner_bridge.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_scheduler.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_prestart_validator.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_safety_guard.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_action_controller.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_execution.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_physical_test.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_automatic_execution_gate.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_runtime.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/switch.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/services.yaml'
          unzip -l doems.zip | grep -F 'custom_components/doems/manifest.json'
          unzip -l doems.zip | grep -F 'RELEASE_NOTES_0.1.0-alpha.38.md'
      - name: Publish Alpha38 Design C Split Reserve Safety prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.1.0-alpha.38 >/dev/null 2>&1; then
            gh release edit 0.1.0-alpha.38 --title "DOEMS 0.1.0-alpha.38 - Design C Split Reserve Safety" --notes-file RELEASE_NOTES_0.1.0-alpha.38.md --prerelease
            gh release upload 0.1.0-alpha.38 doems.zip SHA256SUMS.txt --clobber
          else
            gh release create 0.1.0-alpha.38 doems.zip SHA256SUMS.txt --target main --title "DOEMS 0.1.0-alpha.38 - Design C Split Reserve Safety" --notes-file RELEASE_NOTES_0.1.0-alpha.38.md --prerelease
          fi
