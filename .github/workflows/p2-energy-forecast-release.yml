          grep -F '"physical_execution_enabled": False' custom_components/doems/switch.py
          ! grep -F 'RestoreEntity' custom_components/doems/switch.py
          grep -F '"execution_controller_invoked": False' custom_components/doems/ems_runtime.py
          grep -F '"service_calls_performed": False' custom_components/doems/ems_runtime.py
          grep -F '"physical_execution_authority": False' custom_components/doems/ems_runtime.py
          test -f tests/test_step12_1_control_path_contract.py
          grep -F 'CONF_OPERATING_MODE_ENTITY = "operating_mode_entity"' custom_components/doems/const.py
          grep -F 'CONF_ACTION_DIRECTION_ENTITY = "action_direction_entity"' custom_components/doems/const.py
          grep -F 'CONF_POWER_SETPOINT_ENTITY = "power_setpoint_entity"' custom_components/doems/const.py
          grep -F 'CONTROL_PATH_STABLE_SECONDS = 60' custom_components/doems/const.py
          grep -F 'class DOEMSControlPathObserver' custom_components/doems/ems_control_path.py
