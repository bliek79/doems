name: DOEMS validation and immutable release
on:
  pull_request:
  push:
    branches: [main, p2-alpha84-execution-safety-parity]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: doems-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - python: '3.13'
            homeassistant: '2026.2.3'
          - python: '3.14'
            homeassistant: '2026.9.3'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest pytest-asyncio homeassistant==${{ matrix.homeassistant }}
      - run: python -m compileall -q custom_components/doems scripts
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python scripts/import_smoke.py
      - name: Preserve approved brand icon
        run: test "$(git hash-object custom_components/doems/brand/icon.png)" = "fb0dd2dee9b6c7074da8bdde0f5663260677c779"
      - run: python scripts/release_contract.py --build dist
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ matrix.python }}
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python }}
          path: test-results.xml
  publish:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.number == 107 && github.event.pull_request.head.repo.full_name == 'bliek79/doems' && github.head_ref == 'p2-alpha84-execution-safety-parity')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-3.14
          path: dist
      - name: Validate tested artifact and refuse existing tags or releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("custom_components/doems/manifest.json"))["version"])')
          tag="v$version"
          tested_sha="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$tested_sha" = "${{ github.event.pull_request.head.sha }}"
            test "$version" = "0.2.0-alpha.9.10"
          fi
          python scripts/release_contract.py --tag "$tag" --verify-archive dist/doems.zip
          (cd dist && sha256sum --check SHA256SUMS.txt)
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Existing tag must never be overwritten: $tag"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing release must never be overwritten: $tag"
            exit 1
          fi
          gh release create "$tag" dist/doems.zip dist/SHA256SUMS.txt \
            --target "$tested_sha" --prerelease \
            --title "DOEMS $version" --notes-file "RELEASE_NOTES_$version.md"
          gh release view "$tag" --json tagName,isPrerelease,targetCommitish,assets
          mkdir downloaded
          gh release download "$tag" --dir downloaded --pattern doems.zip --pattern SHA256SUMS.txt
          (cd downloaded && sha256sum --check SHA256SUMS.txt)
          python scripts/release_contract.py --tag "$tag" --verify-archive downloaded/doems.zip
          test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$tested_sha"
