          grep -F '"forecast_coverage_hours"' custom_components/doems/sensor.py
          grep -F '"hours_after_last_usable_solar"' custom_components/doems/sensor.py
          grep -F '"lookahead_limited_by_plan_end"' custom_components/doems/sensor.py
          grep -F 'class DOEMSActionController' custom_components/doems/ems_action_controller.py
          grep -F 'class DOEMSExecutionHandoff' custom_components/doems/ems_execution_handoff.py
          grep -F '"controller_physical_control": False' custom_components/doems/ems_action_controller.py
          grep -F '"auto_execution_handoff_execution_permitted": False' custom_components/doems/ems_execution_handoff.py
