name: DOEMS CI and Alpha4 Solar Freeze Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q custom_components/doems scripts
      - run: pytest -q
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/doems').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid: {path}')
          PY

  publish-alpha4:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore approved DOEMS brand variants
        run: |
          python -m pip install --upgrade pillow pytest
          python scripts/build_brand_assets.py
          pytest -q tests/test_foundation_contract.py
      - name: Commit restored brand assets when changed
        run: |
          if git diff --quiet -- custom_components/doems/brand; then
            echo "Brand assets already match the approved artwork."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components/doems/brand
            git commit -m "Restore approved DOEMS brand assets [skip ci]"
            git push origin HEAD:main
          fi
      - name: Build release archive
        run: |
          zip -r doems.zip custom_components/doems examples/alpha41_solar_freeze_dashboard.yaml LICENSE README.md hacs.json RELEASE_NOTES_0.1.0-alpha.4.md
          sha256sum doems.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish normal Alpha4 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.1.0-alpha.4 >/dev/null 2>&1; then
            echo "Release 0.1.0-alpha.4 already exists; leaving it unchanged."
          else
            gh release create 0.1.0-alpha.4 doems.zip SHA256SUMS.txt --target main --title "DOEMS 0.1.0-alpha.4 - Alpha41 Solar Reference Freeze" --notes-file RELEASE_NOTES_0.1.0-alpha.4.md
          fi
