name: DOEMS CI and Alpha6 Solar P3.1 Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q custom_components/doems scripts
      - run: pytest -q
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/doems').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid: {path}')
          PY
      - name: Validate Alpha6 release contract
        run: |
          test -f RELEASE_NOTES_0.1.0-alpha.6.md
          test -f examples/solar_p3_1_forecast_card.yaml
          grep -F 'VERSION = "0.1.0-alpha.6"' custom_components/doems/const.py
          grep -F '"version": "0.1.0-alpha.6"' custom_components/doems/manifest.json
          grep -F 'sensor.doems_solar_forecast_timeline' examples/solar_p3_1_forecast_card.yaml

  publish-alpha6:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release archive
        run: |
          zip -r doems.zip custom_components/doems examples LICENSE README.md hacs.json RELEASE_NOTES_0.1.0-alpha.6.md
          sha256sum doems.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Verify Solar P3.1 runtime is packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/solar_forecast.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/solar_forecast_model.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/solar_sensor.py'
          unzip -l doems.zip | grep -F 'examples/solar_p3_1_forecast_card.yaml'
      - name: Verify existing DOEMS brand assets are packaged unchanged by this release step
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/icon.png'
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/icon@2x.png'
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/dark_icon.png'
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/dark_icon@2x.png'
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/logo.png'
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/dark_logo.png'
      - name: Publish normal Alpha6 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.1.0-alpha.6 >/dev/null 2>&1; then
            echo "Release 0.1.0-alpha.6 already exists; leaving it unchanged."
          else
            gh release create 0.1.0-alpha.6 doems.zip SHA256SUMS.txt --target main --title "DOEMS 0.1.0-alpha.6 - Solar P3.1 Open-Meteo Runtime" --notes-file RELEASE_NOTES_0.1.0-alpha.6.md
          fi
