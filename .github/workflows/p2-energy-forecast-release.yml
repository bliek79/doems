name: P2.1 Energy Forecast CI and Alpha3 Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q custom_components/doems
      - run: pytest -q
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/doems').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid: {path}')
          PY

  publish-alpha3:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: |
          zip -r doems.zip custom_components/doems LICENSE README.md hacs.json RELEASE_NOTES_0.1.0-alpha.3.md
          sha256sum doems.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish normal Alpha3 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.1.0-alpha.3 >/dev/null 2>&1; then
            echo "Release 0.1.0-alpha.3 already exists; leaving it unchanged."
          else
            gh release create 0.1.0-alpha.3 doems.zip SHA256SUMS.txt --target main --title "DOEMS 0.1.0-alpha.3 - P2.1 Live Green Maintenance" --notes-file RELEASE_NOTES_0.1.0-alpha.3.md
          fi
