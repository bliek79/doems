name: DOEMS CI and 0.2.0-alpha.6 Automatic Planner Shadow Release

on:
  pull_request:
  push:
    branches: [reset-0.2.0-alpha.6]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q custom_components/doems
      - run: pytest -q
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/doems').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid: {path}')
          PY
      - name: Validate 0.2.0-alpha.6 automatic planner shadow
        run: |
          test -f RELEASE_NOTES_0.2.0-alpha.6.md
          test -f examples/prices_p4_forecast_card.yaml
          test -f custom_components/doems/prices.py
          test -f custom_components/doems/prices_model.py
          test -f custom_components/doems/prices_sensor.py
          test -f custom_components/doems/prices_runtime.py
          test -f custom_components/doems/brand/icon.png
          test ! -f scripts/build_brand_assets.py
          test "$(find custom_components/doems/brand -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(git hash-object custom_components/doems/brand/icon.png)" = "fb0dd2dee9b6c7074da8bdde0f5663260677c779"
          grep -F 'VERSION = "0.2.0-alpha.6"' custom_components/doems/const.py
          grep -F '"version": "0.2.0-alpha.6"' custom_components/doems/manifest.json
          grep -F 'build_prices_sensors' custom_components/doems/sensor.py
          grep -F 'DOEMSRegisteredPricesManager' custom_components/doems/__init__.py
          grep -F 'GAS_SOURCE_ENERGYZERO_MARKET_ACTION' custom_components/doems/const.py
          grep -F '"get_gas_prices"' custom_components/doems/prices.py
          grep -F '"incl_vat": True' custom_components/doems/prices.py
          grep -F 'CONF_GAS_ENERGYZERO_CONFIG_ENTRY' custom_components/doems/config_flow.py
          grep -F 'GAS_HIGHER_HEATING_VALUE_KWH_M3 = 9.77' custom_components/doems/const.py
          grep -F 'doems_prices_gas_vs_electricity' custom_components/doems/prices_sensor.py
          grep -F 'energy_carrier_price_only' custom_components/doems/prices.py
          grep -F 'sensor.doems_prices_timeline' examples/prices_p4_forecast_card.yaml
          grep -F 'import_all_in' examples/prices_p4_forecast_card.yaml
          grep -F 'export_all_in' examples/prices_p4_forecast_card.yaml
          test ! -f custom_components/doems/solar_reference_freeze.py
          test ! -f custom_components/doems/solar_reference_freeze_runtime.py
          test ! -f custom_components/doems/button.py
          test ! -f tests/test_solar_reference_freeze_contract.py
          test ! -f examples/alpha41_solar_freeze_dashboard.yaml
          ! grep -R -F 'doems_capture_alpha41_solar_freeze' custom_components/doems
          ! grep -R -F 'doems_alpha41_solar_freeze_captured' custom_components/doems
          test -f custom_components/doems/battery_contract.py
          test -f custom_components/doems/battery_contract_model.py
          test -f tests/test_alpha2_battery_input_contract.py
          grep -F 'CONF_BATTERY_OBSERVATION_ENABLED' custom_components/doems/const.py
          grep -F 'CONF_BATTERY_SOC_ENTITY' custom_components/doems/const.py
          grep -F 'CONF_BATTERY_CAPACITY_ENTITY' custom_components/doems/const.py
          grep -F 'DOEMSBatteryInputContract' custom_components/doems/__init__.py
          grep -F 'doems_battery_input_status' custom_components/doems/sensor.py
          grep -F '"physical_execution_authority": False' custom_components/doems/battery_contract_model.py
          grep -F 'def _battery_power_sources_reusable' custom_components/doems/config_flow.py
          grep -F 'if not reuse_power_sources:' custom_components/doems/config_flow.py
          test -f custom_components/doems/manual_plan_model.py
          test -f custom_components/doems/manual_plan_store.py
          test -f custom_components/doems/manual_plan_services.py
          test -f custom_components/doems/number.py
          test -f custom_components/doems/datetime.py
          test -f custom_components/doems/services.yaml
          test -f tests/test_alpha3_manual_plan_store_contract.py
          grep -F 'DOEMSManualPlanStore' custom_components/doems/__init__.py
          grep -F 'doems_plan_{slot}_status' custom_components/doems/sensor.py
          grep -F 'doems_plan_{slot}_{field}' custom_components/doems/select.py
          grep -F 'doems_plan_{slot}_{definition.object_suffix}' custom_components/doems/number.py
          grep -F 'doems_plan_{slot}_start_time' custom_components/doems/datetime.py
          ! grep -R -F 'automatic_72h_planner' custom_components/doems/manual_plan_store.py custom_components/doems/manual_plan_services.py
          ! grep -R -F 'async_call(' custom_components/doems/manual_plan_store.py custom_components/doems/manual_plan_services.py
          test -f custom_components/doems/manual_soc_projection_model.py
          test -f custom_components/doems/manual_soc_projection.py
          test -f tests/test_alpha4_manual_soc_projection_contract.py
          grep -F 'DOEMSManualSOCProjection' custom_components/doems/__init__.py
          grep -F 'doems_manual_soc_projection' custom_components/doems/sensor.py
          grep -F 'doems_manual_soc_projection_timeline' custom_components/doems/sensor.py
          grep -F 'doems_ems_plan72_hours' custom_components/doems/sensor.py
          grep -F 'FORECAST_SLOTS = 288' custom_components/doems/manual_soc_projection_model.py
          grep -F 'CHARGE_EFFICIENCY = 0.92' custom_components/doems/manual_soc_projection_model.py
          grep -F 'DISCHARGE_EFFICIENCY = 0.92' custom_components/doems/manual_soc_projection_model.py
          grep -F 'MIN_SOC_PERCENT = 5.0' custom_components/doems/manual_soc_projection_model.py
          grep -F '"automatic_planner_active": False' custom_components/doems/manual_soc_projection_model.py
          grep -F '"scheduler_active": False' custom_components/doems/manual_soc_projection_model.py
          grep -F '"physical_execution_authority": False' custom_components/doems/manual_soc_projection_model.py
          ! grep -R -F 'async_call(' custom_components/doems/manual_soc_projection.py custom_components/doems/manual_soc_projection_model.py
          ! grep -R -F 'third_party_control' custom_components/doems/manual_soc_projection.py custom_components/doems/manual_soc_projection_model.py
          ! grep -R -F 'automatic_72h_planner' custom_components/doems/manual_soc_projection.py custom_components/doems/manual_soc_projection_model.py
          test -f custom_components/doems/manual_plan_lifecycle_model.py
          test -f custom_components/doems/manual_plan_lifecycle.py
          test -f tests/test_alpha5_manual_lifecycle_expiry_contract.py
          grep -F 'DOEMSManualPlanLifecycle' custom_components/doems/__init__.py
          grep -F 'doems_manual_plan_lifecycle' custom_components/doems/sensor.py
          grep -F 'async_release_expired_manual_plans' custom_components/doems/manual_plan_store.py
          grep -F 'MANUAL_EXPIRY_REASON = "manual_start_window_expired"' custom_components/doems/manual_plan_lifecycle_model.py
          grep -F 'MANUAL_RELEASE_REASON = "manual_expired_released"' custom_components/doems/manual_plan_lifecycle_model.py
          grep -F 'async_track_point_in_utc_time' custom_components/doems/manual_plan_lifecycle.py
          grep -F '"physical_execution_authority": False' custom_components/doems/manual_plan_lifecycle.py
          grep -F '"scheduler_active": False' custom_components/doems/manual_plan_lifecycle.py
          grep -F '"automatic_planner_active": False' custom_components/doems/manual_plan_lifecycle.py
          ! grep -R -F 'async_call(' custom_components/doems/manual_plan_lifecycle.py custom_components/doems/manual_plan_lifecycle_model.py
          ! grep -R -F 'third_party_control' custom_components/doems/manual_plan_lifecycle.py custom_components/doems/manual_plan_lifecycle_model.py
          ! grep -R -F 'DOEMSScheduler' custom_components/doems/manual_plan_lifecycle.py custom_components/doems/manual_plan_lifecycle_model.py
          test -f custom_components/doems/automatic_planner_model.py
          test -f custom_components/doems/automatic_planner.py
          test -f tests/test_alpha6_automatic_planner_contract.py
          grep -F 'DEFAULT_SOFTWARE_RESERVE_PERCENT = 5.0' custom_components/doems/const.py
          grep -F 'DEFAULT_MAX_CHARGE_POWER_W = 3500.0' custom_components/doems/const.py
          grep -F 'DEFAULT_MAX_DISCHARGE_POWER_W = 3500.0' custom_components/doems/const.py
          grep -F 'DEFAULT_PEAK_SALE_THRESHOLD_EUR_PER_KWH = 0.50' custom_components/doems/const.py
          grep -F 'DOEMSAutomaticPlanner' custom_components/doems/__init__.py
          grep -F 'doems_automatic_planner' custom_components/doems/sensor.py
          grep -F 'doems_automatic_soc_projection_timeline' custom_components/doems/sensor.py
          grep -F "'automatic_plan_store_writes':False" custom_components/doems/automatic_planner_model.py
          grep -F "'scheduler_active':False" custom_components/doems/automatic_planner_model.py
          grep -F "'physical_execution_authority':False" custom_components/doems/automatic_planner_model.py
          ! grep -R -F 'async_call(' custom_components/doems/automatic_planner.py custom_components/doems/automatic_planner_model.py
          ! grep -R -F 'third_party_control' custom_components/doems/automatic_planner.py custom_components/doems/automatic_planner_model.py
          ! grep -R -F 'DOEMSScheduler' custom_components/doems/automatic_planner.py custom_components/doems/automatic_planner_model.py

  publish-reset-alpha6:
    if: github.event_name == 'push' && github.ref == 'refs/heads/reset-0.2.0-alpha.6'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release archive
        run: |
          zip -r doems.zip custom_components/doems examples LICENSE README.md hacs.json RELEASE_NOTES_0.2.0-alpha.6.md
          sha256sum doems.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Verify Prices P4 runtime is packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/prices.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices_model.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices_sensor.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices_runtime.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/config_flow.py'
          unzip -l doems.zip | grep -F 'examples/prices_p4_forecast_card.yaml'
      - name: Verify Battery Input Contract is packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/battery_contract.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/battery_contract_model.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/config_flow.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/sensor.py'
          unzip -l doems.zip | grep -F 'RELEASE_NOTES_0.2.0-alpha.6.md'
      - name: Verify Manual Plan Store is packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/manual_plan_model.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/manual_plan_store.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/manual_plan_services.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/number.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/datetime.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/services.yaml'
          unzip -l doems.zip | grep -F 'RELEASE_NOTES_0.2.0-alpha.6.md'
      - name: Verify Manual SOC Replanning is packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/manual_soc_projection_model.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/manual_soc_projection.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/sensor.py'
          unzip -l doems.zip | grep -F 'RELEASE_NOTES_0.2.0-alpha.6.md'
      - name: Verify Manual Lifecycle Expiry is packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/manual_plan_lifecycle_model.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/manual_plan_lifecycle.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/manual_plan_store.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/sensor.py'
          unzip -l doems.zip | grep -F 'RELEASE_NOTES_0.2.0-alpha.6.md'
      - name: Verify Automatic Planner Shadow is packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/automatic_planner.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/automatic_planner_model.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/sensor.py'
          unzip -l doems.zip | grep -F 'RELEASE_NOTES_0.2.0-alpha.6.md'
      - name: Verify exact existing DOEMS brand icon is packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/icon.png'
          test "$(git hash-object custom_components/doems/brand/icon.png)" = "fb0dd2dee9b6c7074da8bdde0f5663260677c779"
          test "$(find custom_components/doems/brand -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Publish 0.2.0-alpha.6 automatic planner shadow release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.2.0-alpha.6 >/dev/null 2>&1; then
            gh release edit 0.2.0-alpha.6 --title "DOEMS 0.2.0-alpha.6 - Automatic Planner Shadow" --notes-file RELEASE_NOTES_0.2.0-alpha.6.md --prerelease
            gh release upload 0.2.0-alpha.6 doems.zip SHA256SUMS.txt --clobber
          else
            gh release create 0.2.0-alpha.6 doems.zip SHA256SUMS.txt --target reset-0.2.0-alpha.6 --title "DOEMS 0.2.0-alpha.6 - Manual Lifecycle Expiry" --notes-file RELEASE_NOTES_0.2.0-alpha.6.md --prerelease
          fi
