name: DOEMS CI - Alpha32 Full Anker Alpha76 EMS Parity Candidate

on:
  pull_request:
  push:
    branches:
      - alpha32-full-anker-alpha76-parity-reconstruction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - name: Compile integration
        run: python -m compileall -q custom_components/doems
      - name: Alpha32 full source parity guard
        run: pytest -q tests/test_alpha32_full_anker_alpha76_parity.py
      - name: Exact planner parity
        run: pytest -q tests/test_alpha31_exact_anker_planner_parity.py
      - name: Execution and restart parity
        run: pytest -q tests/test_alpha23_execution_naming_cleanup.py tests/test_alpha26_step15a_manual_physical_execution.py tests/test_alpha27_beta2_automatic_plan72_cutover.py tests/test_alpha29_signature_warning_physical_parity.py tests/test_step12_3_final_revalidation_mode_switch_preview.py tests/test_step12_4_automatic_execution_gate.py tests/test_step12_5_execution_controller.py tests/test_step12_6_restart_recovery_observability.py
      - name: Planner Scheduler Safety regression
        run: pytest -q tests/test_alpha8_ems_plans_foundation.py tests/test_step11_safety_prestart_contract.py tests/test_step12_1_control_path_contract.py tests/test_step12_2_action_handoff_contract.py tests/test_plan72_observability_parity.py
      - name: Forecast Prices Foundation regression
        run: pytest -q tests/test_alpha5_1_hotfix_contract.py tests/test_alpha5_2_status_hotfix_contract.py tests/test_alpha6_solar_p31_release_contract.py tests/test_alpha7_prices_release_contract.py tests/test_energy_forecast_contract.py tests/test_foundation_contract.py tests/test_alpha21_multirate_runtime.py tests/test_alpha25_solar_array_performance.py tests/test_ems_config_validation.py tests/test_ems_settings_contract.py tests/test_presence_runtime_contract.py tests/test_prices_p4_contract.py tests/test_recorder_attribute_budget.py tests/test_solar_actual_quarter_validation.py tests/test_solar_forecast_model.py tests/test_solar_foundation_contract.py tests/test_solar_p31_runtime_contract.py tests/test_step5a_consumer_wiring_part1.py tests/test_step5a_forecast_diagnostics.py tests/test_step5a_prices_76h_window_fix.py
      - name: Full pytest
        run: pytest -q
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components/doems").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid: {path}")
          PY
      - name: Validate Alpha32 candidate contract
        run: |
          test -f RELEASE_NOTES_0.1.0-alpha.32.md
          grep -F 'VERSION = "0.1.0-alpha.32"' custom_components/doems/const.py
          grep -F '"version": "0.1.0-alpha.32"' custom_components/doems/manifest.json
          grep -F 'RestoreEntity' custom_components/doems/switch.py
          grep -F 'previous.attributes.get("mode") == "live_guarded"' custom_components/doems/switch.py
          grep -F 'planned_energy_reached' custom_components/doems/ems_execution.py
          grep -F 'abs(actual_setpoint - expected_power) > 10' custom_components/doems/ems_execution.py
          grep -F 'self.execution.evaluate_final_revalidation(' custom_components/doems/ems_runtime.py
          grep -F 'self.execution.evaluate_mode_switch_transaction(' custom_components/doems/ems_runtime.py
          ! grep -F 'DOEMSManualPhysicalExecution' custom_components/doems/ems_runtime.py
          test -f custom_components/doems/ems_physical_test.py
          test -f tests/test_alpha32_full_anker_alpha76_parity.py
          test "$(git hash-object custom_components/doems/brand/icon.png)" = "fb0dd2dee9b6c7074da8bdde0f5663260677c779"
