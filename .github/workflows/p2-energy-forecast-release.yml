          grep -F '"service_calls_performed": False' custom_components/doems/ems_automatic_execution_gate.py
          grep -F '"physical_execution_authority": False' custom_components/doems/ems_automatic_execution_gate.py
          ! grep -F '.services.async_call(' custom_components/doems/ems_automatic_execution_gate.py
          grep -F 'class DOEMSExecutionControllerShadow' custom_components/doems/ems_execution_shadow.py
          grep -F '"execution_controller_invoked": False' custom_components/doems/ems_execution_shadow.py
          grep -F '"service_calls_performed": False' custom_components/doems/ems_execution_shadow.py
          grep -F '"physical_execution_authority": False' custom_components/doems/ems_execution_shadow.py
          grep -F '"safe_return_performed": False' custom_components/doems/ems_execution_shadow.py
          ! grep -F '.services.async_call(' custom_components/doems/ems_execution_shadow.py
          ! grep -F 'select.select_option' custom_components/doems/ems_execution_shadow.py
          ! grep -F 'number.set_value' custom_components/doems/ems_execution_shadow.py
