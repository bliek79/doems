  publish-alpha18:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release archive
        run: |
          zip -r doems.zip custom_components/doems examples LICENSE README.md hacs.json RELEASE_NOTES_0.1.0-alpha.18.md
          sha256sum doems.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Verify EMS settings, Presence and Prices runtime are packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_settings.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_input_contract.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_live_input.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_alpha76_adapter.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_runtime.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_plan_store.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_scheduler.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_planner_bridge.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_prestart_validator.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_safety_guard.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_control_path.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_action_controller.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_execution_handoff.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_final_revalidation.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_mode_switch_preview.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_automatic_execution_gate.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_execution_shadow.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_g5_live_parity.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_g5_live_parity_runtime.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_g5_live_parity_sensor.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/button.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/number.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_alpha76/planner_72h.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/presence.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/switch.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/datetime.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices_model.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices_sensor.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices_runtime.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/config_flow.py'
          unzip -l doems.zip | grep -F 'examples/prices_p4_forecast_card.yaml'
      - name: Verify exact existing DOEMS brand icon is packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/icon.png'
          test "$(git hash-object custom_components/doems/brand/icon.png)" = "fb0dd2dee9b6c7074da8bdde0f5663260677c779"
          test "$(find custom_components/doems/brand -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Publish Alpha18 Step 13 G5 Frozen Live Parity release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.1.0-alpha.18 >/dev/null 2>&1; then
            gh release edit 0.1.0-alpha.18 --title "DOEMS 0.1.0-alpha.18 - Step 13 G5 Frozen Live Parity" --notes-file RELEASE_NOTES_0.1.0-alpha.18.md --prerelease
          else
            gh release create 0.1.0-alpha.18 doems.zip SHA256SUMS.txt --target main --title "DOEMS 0.1.0-alpha.18 - Step 13 G5 Frozen Live Parity" --notes-file RELEASE_NOTES_0.1.0-alpha.18.md --prerelease
          fi
