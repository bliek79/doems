name: DOEMS CI and Alpha8.1 Manual Plan Lifecycle Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q custom_components/doems
      - run: pytest -q
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/doems').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid: {path}')
          PY
      - name: Validate Alpha8.1 release contract
        run: |
          test -f RELEASE_NOTES_0.1.0-alpha.8.1.1.md
          test -f examples/prices_p4_forecast_card.yaml
          test -f custom_components/doems/prices.py
          test -f custom_components/doems/prices_model.py
          test -f custom_components/doems/prices_sensor.py
          test -f custom_components/doems/prices_runtime.py
          test -f custom_components/doems/brand/icon.png
          test ! -f scripts/build_brand_assets.py
          test "$(find custom_components/doems/brand -maxdepth 1 -type f | wc -l)" -eq 1
          test "$(git hash-object custom_components/doems/brand/icon.png)" = "fb0dd2dee9b6c7074da8bdde0f5663260677c779"
          grep -F 'VERSION = "0.1.0-alpha.8.1"' custom_components/doems/const.py
          grep -F '"version": "0.1.0-alpha.8.1"' custom_components/doems/manifest.json
          grep -F 'CONF_EMS_ENABLED = "ems_enabled"' custom_components/doems/const.py
          grep -F 'CONF_BATTERY_CAPACITY_KWH = "battery_capacity_kwh"' custom_components/doems/const.py
          grep -F 'CONF_TECHNICAL_MIN_SOC_PERCENT = "technical_min_soc_percent"' custom_components/doems/const.py
          grep -F 'CONF_MAX_SOC_PERCENT = "max_soc_percent"' custom_components/doems/const.py
          grep -F 'CONF_MAX_CHARGE_POWER_W = "max_charge_power_w"' custom_components/doems/const.py
          grep -F 'CONF_MAX_DISCHARGE_POWER_W = "max_discharge_power_w"' custom_components/doems/const.py
          grep -F 'CONF_SOFTWARE_RESERVE_PERCENT = "software_reserve_percent"' custom_components/doems/const.py
          grep -F 'CONF_CHARGE_EFFICIENCY_PERCENT = "charge_efficiency_percent"' custom_components/doems/const.py
          grep -F 'CONF_DISCHARGE_EFFICIENCY_PERCENT = "discharge_efficiency_percent"' custom_components/doems/const.py
          grep -F 'CONF_MINIMUM_TRADE_MARGIN_EUR_PER_KWH = "minimum_trade_margin_eur_per_kwh"' custom_components/doems/const.py
          grep -F 'CONF_STARTUP_DELAY_SECONDS = "startup_delay_seconds"' custom_components/doems/const.py
          test -f custom_components/doems/ems_settings.py
          test -f custom_components/doems/ems_input_contract.py
          test -f custom_components/doems/ems_live_input.py
          test -f custom_components/doems/ems_alpha76_adapter.py
          test -f custom_components/doems/ems_runtime.py
          test -f custom_components/doems/ems_plan_store.py
          test -f custom_components/doems/ems_scheduler.py
          test -f custom_components/doems/ems_planner_bridge.py
          test -f custom_components/doems/ems_soc.py
          test -f custom_components/doems/number.py
          test -f tests/test_alpha8_ems_plans_foundation.py
          grep -F 'PLAN_SLOT_COUNT = 3' custom_components/doems/const.py
          grep -F 'class DOEMSPlanStore' custom_components/doems/ems_plan_store.py
          grep -F 'f"{DOMAIN}.{entry_id}.plans"' custom_components/doems/ems_plan_store.py
          grep -F 'class DOEMSScheduler' custom_components/doems/ems_scheduler.py
          grep -F 'class DOEMSEMSRuntime' custom_components/doems/ems_runtime.py
          grep -F 'run_ems_chain' custom_components/doems/ems_alpha76_adapter.py
          grep -F 'doems_plan_{slot}_{field}' custom_components/doems/select.py
          grep -F 'doems_plan_{slot}_{definition.object_suffix}' custom_components/doems/number.py
          grep -F 'doems_plan_{slot}_start_time' custom_components/doems/datetime.py
          grep -F 'doems_plan_{slot}_status' custom_components/doems/sensor.py
          grep -F 'doems_scheduler' custom_components/doems/sensor.py
          grep -F 'doems_ems' custom_components/doems/sensor.py
          test ! -f custom_components/doems/ems_shadow_runtime.py
          test ! -f custom_components/doems/ems_step5c.py
          ! grep -R -F 'legacy_authority_entity' custom_components/doems
          ! grep -R -F 'legacy_automatic_execution_entity' custom_components/doems
          test -f custom_components/doems/ems_alpha76/energy_need.py
          test -f custom_components/doems/ems_alpha76/planner_preview.py
          test -f custom_components/doems/ems_alpha76/planner_72h.py
          grep -F 'alpha41_rolling_quarter_start_no_clock_hour_rounding' custom_components/doems/ems_input_contract.py
          grep -F 'existing_doems_forecast' custom_components/doems/ems_live_input.py
          grep -F 'planner_runtime_active": True' custom_components/doems/ems_alpha76_adapter.py
          grep -F 'plan_store_write": True' custom_components/doems/ems_alpha76_adapter.py
          grep -F 'scheduler_invoked": True' custom_components/doems/ems_alpha76_adapter.py
          grep -F 'service_calls_performed": False' custom_components/doems/ems_alpha76_adapter.py
          grep -F 'physical_execution_authority": False' custom_components/doems/ems_alpha76_adapter.py
          grep -F 'class EMSSettings' custom_components/doems/ems_settings.py
          grep -F 'EMSSettings.from_options(entry.options)' custom_components/doems/__init__.py
          grep -F 'doems_ems_settings' custom_components/doems/sensor.py
          grep -F '"settings_source": "config_entry_options"' custom_components/doems/sensor.py
          grep -F '"settings_snapshot_immutable": True' custom_components/doems/sensor.py
          grep -F '"startup_delay_runtime_gate_active": False' custom_components/doems/sensor.py
          grep -F '"planner_logic_active": self.runtime is not None' custom_components/doems/sensor.py
          grep -F '"physical_execution_authority": False' custom_components/doems/sensor.py
          grep -F 'CONF_AWAY_SCHEDULE_ENABLED = "away_schedule_enabled"' custom_components/doems/const.py
          grep -F 'CONF_AWAY_START = "away_start"' custom_components/doems/const.py
          grep -F 'CONF_AWAY_END = "away_end"' custom_components/doems/const.py
          grep -F 'PRESENCE_STORAGE_KEY = f"{DOMAIN}.presence"' custom_components/doems/const.py
          grep -F 'PLATFORMS = ["sensor", "select", "number", "binary_sensor", "switch", "datetime"]' custom_components/doems/const.py
          test -f custom_components/doems/presence.py
          test -f custom_components/doems/switch.py
          test -f custom_components/doems/datetime.py
          grep -F 'class DOEMSPresenceStore' custom_components/doems/presence.py
          grep -F 'doems_presence_profile' custom_components/doems/select.py
          grep -F 'doems_away_schedule_enabled' custom_components/doems/switch.py
          grep -F 'doems_away_start' custom_components/doems/datetime.py
          grep -F 'doems_away_end' custom_components/doems/datetime.py
          grep -F 'doems_away_active' custom_components/doems/binary_sensor.py
          grep -F 'doems_away_schedule_valid' custom_components/doems/binary_sensor.py
          grep -F 'doems_presence_context' custom_components/doems/sensor.py
          grep -F 'PROFILE_UNCLASSIFIED' custom_components/doems/presence.py
          grep -F 'manual_override_active' custom_components/doems/presence.py
          grep -F 'physical_execution_authority": False' custom_components/doems/presence.py
          test -f custom_components/doems/ems_config_validation.py
          grep -F 'EMS_VALIDATED_FIELDS' custom_components/doems/ems_config_validation.py
          grep -F 'ERR_INVALID_NUMBER = "ems_invalid_number"' custom_components/doems/ems_config_validation.py
          grep -F 'ERR_SOC_RANGE_INVALID = "ems_soc_range_invalid"' custom_components/doems/ems_config_validation.py
          ! grep -F 'CONF_AWAY_START' custom_components/doems/ems_config_validation.py
          ! grep -F 'CONF_AWAY_END' custom_components/doems/ems_config_validation.py
          ! grep -F 'CONF_AWAY_SCHEDULE_ENABLED' custom_components/doems/ems_config_validation.py
          grep -F 'validate_ems_combination(normalized)' custom_components/doems/config_flow.py
          grep -F 'validate_ems_field' custom_components/doems/config_flow.py
          grep -F 'errors=errors' custom_components/doems/config_flow.py
          grep -F 'DEFAULT_STARTUP_DELAY_SECONDS = 30' custom_components/doems/const.py
          grep -F 'EMS_MIN_STARTUP_DELAY_SECONDS = 30' custom_components/doems/const.py
          grep -F 'EMS_MAX_STARTUP_DELAY_SECONDS = 300' custom_components/doems/const.py
          grep -F 'EMS_MAX_POWER_W = 3500' custom_components/doems/const.py
          grep -F 'async def async_step_ems' custom_components/doems/config_flow.py
          grep -F 'build_prices_sensors' custom_components/doems/sensor.py
          grep -F 'DOEMSRegisteredPricesManager' custom_components/doems/__init__.py
          grep -F 'GAS_SOURCE_ENERGYZERO_MARKET_ACTION' custom_components/doems/const.py
          grep -F '"get_gas_prices"' custom_components/doems/prices.py
          grep -F '"incl_vat": True' custom_components/doems/prices.py
          grep -F 'CONF_GAS_ENERGYZERO_CONFIG_ENTRY' custom_components/doems/config_flow.py
          grep -F 'GAS_HIGHER_HEATING_VALUE_KWH_M3 = 9.77' custom_components/doems/const.py
          grep -F 'doems_prices_gas_vs_electricity' custom_components/doems/prices_sensor.py
          grep -F 'energy_carrier_price_only' custom_components/doems/prices.py
          grep -F 'sensor.doems_prices_timeline' examples/prices_p4_forecast_card.yaml
          grep -F 'import_all_in' examples/prices_p4_forecast_card.yaml
          grep -F 'export_all_in' examples/prices_p4_forecast_card.yaml
          test ! -f custom_components/doems/solar_reference_freeze.py
          test ! -f custom_components/doems/solar_reference_freeze_runtime.py
          test ! -f custom_components/doems/button.py
          test ! -f tests/test_solar_reference_freeze_contract.py
          test ! -f examples/alpha41_solar_freeze_dashboard.yaml
          ! grep -R -F 'doems_capture_alpha41_solar_freeze' custom_components/doems
          ! grep -R -F 'doems_alpha41_solar_freeze_captured' custom_components/doems

  publish-alpha8-1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release archive
        run: |
          zip -r doems.zip custom_components/doems examples LICENSE README.md hacs.json RELEASE_NOTES_0.1.0-alpha.8.1.1.md
          sha256sum doems.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Verify EMS settings, Presence and Prices runtime are packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_settings.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_input_contract.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_live_input.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_alpha76_adapter.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_runtime.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_plan_store.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_scheduler.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_planner_bridge.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/number.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/ems_alpha76/planner_72h.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/presence.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/switch.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/datetime.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices_model.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices_sensor.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices_runtime.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/config_flow.py'
          unzip -l doems.zip | grep -F 'examples/prices_p4_forecast_card.yaml'
      - name: Verify exact existing DOEMS brand icon is packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/icon.png'
          test "$(git hash-object custom_components/doems/brand/icon.png)" = "fb0dd2dee9b6c7074da8bdde0f5663260677c779"
          test "$(find custom_components/doems/brand -maxdepth 1 -type f | wc -l)" -eq 1
      - name: Publish Alpha8.1 manual plan lifecycle release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.1.0-alpha.8.1 >/dev/null 2>&1; then
            gh release edit 0.1.0-alpha.8.1 --title "DOEMS 0.1.0-alpha.8.1 - Manual Plan Lifecycle Fix" --notes-file RELEASE_NOTES_0.1.0-alpha.8.1.1.md --prerelease
          else
            gh release create 0.1.0-alpha.8.1 doems.zip SHA256SUMS.txt --target main --title "DOEMS 0.1.0-alpha.8.1 - Manual Plan Lifecycle Fix" --notes-file RELEASE_NOTES_0.1.0-alpha.8.1.1.md --prerelease
          fi
