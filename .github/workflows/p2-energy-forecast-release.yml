          ! grep -F 'set_value' custom_components/doems/ems_action_controller.py
          ! grep -F 'select_option' custom_components/doems/ems_execution_handoff.py
          ! grep -F 'set_value' custom_components/doems/ems_execution_handoff.py
          ! grep -F '.services.async_call(' custom_components/doems/ems_final_revalidation.py
          ! grep -F '.services.async_call(' custom_components/doems/ems_mode_switch_preview.py
