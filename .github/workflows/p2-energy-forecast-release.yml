name: DOEMS CI and Alpha7.5 Full Brand Logo Integration Icon Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest pillow
      - run: python -m compileall -q custom_components/doems scripts
      - name: Validate deterministic full-logo brand assets
        run: |
          python scripts/build_brand_assets.py
          git diff --exit-code -- custom_components/doems/brand
          grep -F '_fit_complete_logo_on_square' scripts/build_brand_assets.py
          test "$(grep -c '\\.crop(' scripts/build_brand_assets.py)" -eq 0
      - run: pytest -q
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/doems').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid: {path}')
          PY
      - name: Validate Alpha7.5 release contract
        run: |
          test -f RELEASE_NOTES_0.1.0-alpha.7.5.md
          test -f examples/prices_p4_forecast_card.yaml
          test -f custom_components/doems/prices.py
          test -f custom_components/doems/prices_model.py
          test -f custom_components/doems/prices_sensor.py
          test -f custom_components/doems/prices_runtime.py
          grep -F 'VERSION = "0.1.0-alpha.7.5"' custom_components/doems/const.py
          grep -F '"version": "0.1.0-alpha.7.5"' custom_components/doems/manifest.json
          grep -F 'build_prices_sensors' custom_components/doems/sensor.py
          grep -F 'DOEMSRegisteredPricesManager' custom_components/doems/__init__.py
          grep -F 'GAS_SOURCE_ENERGYZERO_MARKET_ACTION' custom_components/doems/const.py
          grep -F '"get_gas_prices"' custom_components/doems/prices.py
          grep -F '"incl_vat": True' custom_components/doems/prices.py
          grep -F 'CONF_GAS_ENERGYZERO_CONFIG_ENTRY' custom_components/doems/config_flow.py
          grep -F 'GAS_HIGHER_HEATING_VALUE_KWH_M3 = 9.77' custom_components/doems/const.py
          grep -F 'doems_prices_gas_vs_electricity' custom_components/doems/prices_sensor.py
          grep -F 'energy_carrier_price_only' custom_components/doems/prices.py
          grep -F 'sensor.doems_prices_timeline' examples/prices_p4_forecast_card.yaml
          grep -F 'import_all_in' examples/prices_p4_forecast_card.yaml
          grep -F 'export_all_in' examples/prices_p4_forecast_card.yaml

  publish-alpha7-5:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release archive
        run: |
          zip -r doems.zip custom_components/doems examples LICENSE README.md hacs.json RELEASE_NOTES_0.1.0-alpha.7.5.md
          sha256sum doems.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Verify Prices P4 runtime is packaged
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/prices.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices_model.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices_sensor.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/prices_runtime.py'
          unzip -l doems.zip | grep -F 'custom_components/doems/config_flow.py'
          unzip -l doems.zip | grep -F 'examples/prices_p4_forecast_card.yaml'
      - name: Verify the single DOEMS brand logo is packaged for all brand roles
        run: |
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/icon.png'
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/icon@2x.png'
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/dark_icon.png'
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/dark_icon@2x.png'
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/logo.png'
          unzip -l doems.zip | grep -F 'custom_components/doems/brand/dark_logo.png'
      - name: Publish normal Alpha7.5 release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.1.0-alpha.7.5 >/dev/null 2>&1; then
            gh release edit 0.1.0-alpha.7.5 --title "DOEMS 0.1.0-alpha.7.5 - Full Brand Logo Integration Icon" --notes-file RELEASE_NOTES_0.1.0-alpha.7.5.md
          else
            gh release create 0.1.0-alpha.7.5 doems.zip SHA256SUMS.txt --target main --title "DOEMS 0.1.0-alpha.7.5 - Full Brand Logo Integration Icon" --notes-file RELEASE_NOTES_0.1.0-alpha.7.5.md
          fi
