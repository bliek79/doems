name: DOEMS 3.0 alpha.8.8 Solar Remaining Today release
on:
  push:
    branches:
      - doems3-solar-remaining-alpha-8-8
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q custom_components/doems scripts tests
      - run: python -m pytest -q --junitxml=build/test-results.xml
      - name: Verify unchanged DOEMS 3.0 chapter 8 protected sources
        run: python scripts/validate_scheduler_release.py
      - name: Package exact validated source
        if: matrix.python-version == '3.13'
        run: python scripts/build_scheduler_release.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: verified-doems-3-alpha-8-8
          path: |
            build/doems.zip
            build/SHA256SUMS.txt
            build/RELEASE_PROVENANCE.json
          if-no-files-found: error
  publish:
    needs: validate
    if: github.ref == 'refs/heads/doems3-solar-remaining-alpha-8-8'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: verified-doems-3-alpha-8-8
          path: build/
      - name: Check immutable version, archive, provenance, and SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=0.3.0-alpha.8.8
          tag="v$version"
          test "$(python -c 'import json; print(json.load(open("custom_components/doems/manifest.json"))["version"])')" = "$version"
          python scripts/validate_scheduler_release.py
          (cd build && sha256sum --check SHA256SUMS.txt)
          python - <<'PY'
          import json, subprocess, zipfile
          with zipfile.ZipFile("build/doems.zip") as z:
              manifest=json.loads(z.read("custom_components/doems/manifest.json"))
              assert manifest["version"] == "0.3.0-alpha.8.8"
              solar=z.read("custom_components/doems/solar_sensor.py").decode()
              assert "DOEMSSolarForecastRemainingTodaySensor(entry, manager)" in solar
              assert "doems_solar_forecast_remaining_today" in solar
          provenance=json.load(open("build/RELEASE_PROVENANCE.json"))
          assert provenance["version"] == "0.3.0-alpha.8.8"
          assert provenance["commit"] == subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert provenance["physical_execution_authority"] is False
          assert provenance["execution_enabled"] is False
          PY
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Existing immutable tag; refusing publish: $tag"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing release; refusing publish: $tag"
            exit 1
          fi
      - name: Publish exact tested 3.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.3.0-alpha.8.8
          gh release create "$tag" build/doems.zip build/SHA256SUMS.txt build/RELEASE_PROVENANCE.json \
            --target "$GITHUB_SHA" --prerelease \
            --title "DOEMS 3.0 alpha.8.8 - Solar Remaining Today" \
            --notes-file RELEASE_NOTES_v0.3.0-alpha.8.8.md
          test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          mkdir -p verified-download
          gh release download "$tag" --dir verified-download \
            --pattern doems.zip --pattern SHA256SUMS.txt --pattern RELEASE_PROVENANCE.json
          (cd verified-download && sha256sum --check SHA256SUMS.txt)
