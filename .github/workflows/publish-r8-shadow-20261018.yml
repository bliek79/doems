name: Publish R8 original-route shadow
on:
  push:
    branches: [release-r8-shadow-original-route-20261018]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Full CI and syntax
        run: |
          python -m pip install --upgrade pip pytest
          python -m compileall -q custom_components/doems
          pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("custom_components/doems").rglob("*.json"):
              json.loads(path.read_text())
          PY
      - name: Frozen R7 and planners guard
        run: |
          git diff --name-only 0d9210e279b83561cee0d4d587b7076b48fc8360 HEAD > changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
            "custom_components/doems/r8_shadow.py",
            "custom_components/doems/sensor.py",
            "custom_components/doems/manifest.json",
            "custom_components/doems/const.py",
            "tests/test_r8_shadow_contract.py",
            "tests/test_alpha5_2_status_hotfix_contract.py",
            "tests/test_alpha7_1_planner_migration_contract.py",
            "tests/test_alpha7_prices_release_contract.py",
            "tests/test_energy_forecast_contract.py",
            "RELEASE_NOTES_0.2.0-alpha.8.0.3.md",
            ".github/workflows/publish-r8-shadow-20261018.yml",
          }
          actual = set(Path("changed.txt").read_text().splitlines())
          assert actual <= allowed, sorted(actual - allowed)
          assert {"custom_components/doems/r8_shadow.py", "custom_components/doems/sensor.py"} <= actual
          PY
      - name: Build and validate ZIP
        run: |
          zip -r doems.zip custom_components/doems examples LICENSE README.md hacs.json RELEASE_NOTES_0.2.0-alpha.8.0.3.md
          unzip -t doems.zip
          unzip -l doems.zip | grep -F custom_components/doems/r8_shadow.py
          sha256sum doems.zip > SHA256SUMS.txt
      - name: Publish after all checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 0.2.0-alpha.8.0.3 doems.zip SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "DOEMS 0.2.0-alpha.8.0.3 - R8 shadow execution" --notes-file RELEASE_NOTES_0.2.0-alpha.8.0.3.md
