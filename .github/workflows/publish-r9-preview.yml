name: Publish R9 preview prerelease
on:
  push:
    branches:
      - release/r9-manual-independent-alpha9.2
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and manifest
        run: |
          python -m compileall -q custom_components/doems
          python -c "import json; d=json.load(open('custom_components/doems/manifest.json')); assert d['version']=='0.2.0-alpha.9.2'"
      - name: Publish immutable preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0-alpha.9.2 >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create v0.2.0-alpha.9.2 \
            --target "$GITHUB_SHA" \
            --title "DOEMS 0.2.0-alpha.9.2 - R9 Manual Independence Shadow Preview" \
            --prerelease \
            --notes "R9 shadow preview: manual R7 safety validates independent configured charge/discharge limits and hard SOC reserve when Automatic/Combined is blocked. All 238 Python tests and three GitHub CI workflows passed on the source PR. Physical Anker control remains DISABLED. Home Assistant live validation is still required; do not use for live battery execution."
