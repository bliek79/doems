name: Publish R9 preview prerelease
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and manifest
        run: |
          python -m compileall -q custom_components/doems
          python -c "import json, pathlib, re; v=json.loads(pathlib.Path('custom_components/doems/manifest.json').read_text())['version']; c=pathlib.Path('custom_components/doems/const.py').read_text(); assert v=='0.2.0-alpha.9.4' and re.search(r'^VERSION\\s*=\\s*\"'+re.escape(v)+r'\"', c, re.M), 'Version identity mismatch'"
      - name: Publish immutable preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0-alpha.9.4 >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create v0.2.0-alpha.9.4 \
            --target "$GITHUB_SHA" \
            --title "DOEMS 0.2.0-alpha.9.4 - Prices DST Fallback and EnergyZero Startup Fix" \
            --prerelease \
            --notes "Prices: conservative Europe/Amsterdam repeated-hour DST fallback uses the higher adjacent Stroomvoorspeller forecast for four missing quarters, marked estimated_dst_fallback; source values always override estimates. EnergyZero startup retry waits for the source and is cancelled on shutdown. Native 15m/72h/288 architecture and shadow-only physical execution remain unchanged. CI passed; live Home Assistant validation remains required."
