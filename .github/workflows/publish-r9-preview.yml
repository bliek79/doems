name: Publish R9 preview prerelease
on:
  push:
    branches:
      - release/r9-threadsafe-alpha9.3
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and manifest
        run: |
          python -m compileall -q custom_components/doems
          python -c "import json; d=json.load(open('custom_components/doems/manifest.json')); assert d['version']=='0.2.0-alpha.9.3'"
      - name: Publish immutable preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0-alpha.9.3 >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create v0.2.0-alpha.9.3 \
            --target "$GITHUB_SHA" \
            --title "DOEMS 0.2.0-alpha.9.3 - R9 Thread-Safe Shadow Preview" \
            --prerelease \
            --notes "R9 thread-safety fix: R7 and R9 worker-thread notifications are marshalled onto the Home Assistant event loop before scheduling tasks. R9 listener errors are isolated. Manual/Automatic/Combined planner logic unchanged. Physical Anker control remains DISABLED. GitHub CI passed on PR #101; Home Assistant live validation is still required."
