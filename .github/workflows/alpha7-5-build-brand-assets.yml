name: Alpha7.5 Build Brand Assets

on:
  push:
    branches: [alpha7-5-general-doems-icon-fix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-brand-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha7-5-general-doems-icon-fix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pillow
      - name: Rebuild approved DOEMS brand assets
        run: python scripts/build_brand_assets.py
      - name: Commit generated PNGs when needed
        run: |
          if git diff --quiet -- custom_components/doems/brand; then
            echo "Brand assets already deterministic."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/doems/brand
          git commit -m "Alpha7.5: rebuild brand assets from approved logo"
          git push origin HEAD:alpha7-5-general-doems-icon-fix
