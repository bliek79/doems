name: DOEMS 3.0 Chapter 8 validation

on:
  push:
    branches:
      - doems3-ch8-scheduler-implementation
      - doems3-ch8-alpha84-corrections
      - doems3-ch8-compaction-rounding-fix
      - doems3-ch8-full-chain-window-grouping
      - doems3-alpha84-planner-parity
      - doems3-alpha84-planner-parity-recovery-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q custom_components/doems scripts
      - run: python -m pytest -q --junitxml=build/test-results.xml
      - run: python scripts/validate_scheduler_release.py
      - name: Require full Alpha84 planning parity on repair branch
        if: github.ref_name == 'doems3-alpha84-planner-parity'
        run: python scripts/compare_alpha84_planners.py --output build/alpha84-planner-parity.json
      - name: Preserve differential evidence even when parity fails
        if: always() && github.ref_name == 'doems3-alpha84-planner-parity'
        uses: actions/upload-artifact@v4
        with:
          name: alpha84-parity-${{ matrix.python-version }}-${{ github.sha }}
          path: build/alpha84-planner-parity.json
          if-no-files-found: warn
      - name: Package exact tested source without publication
        if: matrix.python-version == '3.13'
        run: python scripts/build_scheduler_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-${{ matrix.python-version }}-${{ github.sha }}
          path: build/
          if-no-files-found: error
