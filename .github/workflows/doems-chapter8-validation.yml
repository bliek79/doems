name: DOEMS 3.0 Chapter 8 validation

on:
  push:
    branches:
      - doems3-ch8-scheduler-implementation
      - doems3-ch8-alpha84-corrections
      - doems3-ch8-compaction-rounding-fix
      - doems3-ch8-full-chain-window-grouping
      - doems3-alpha84-planner-parity
      - doems3-h8-contiguous-quarter-allocation
      - doems3-h5-h8-anker84-baseline-correction
      - doems3-alpha84-planner-parity-recovery-20261116
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q custom_components/doems scripts
      - run: python -m pytest -q --junitxml=build/test-results.xml
      - run: python scripts/validate_scheduler_release.py
      - name: Require full Alpha84 planning parity on repair branch
        if: github.ref_name == 'doems3-alpha84-planner-parity'
        run: python scripts/compare_alpha84_planners.py --output build/alpha84-planner-parity.json
      - name: Preserve differential evidence even when parity fails
        if: always() && github.ref_name == 'doems3-alpha84-planner-parity'
        uses: actions/upload-artifact@v4
        with:
          name: alpha84-parity-${{ matrix.python-version }}-${{ github.sha }}
          path: build/alpha84-planner-parity.json
          if-no-files-found: warn
      - name: Check frozen Alpha84 source versus active quarter-based factory and Plan72
        if: github.ref_name == 'doems3-h8-contiguous-quarter-allocation'
        run: |
          python scripts/verify_alpha84_repaired_chain.py --output build/alpha84-active-fullchain.json
          python - <<'PY'
          import json
          cases=json.load(open('build/alpha84-active-fullchain.json'))['cases']
          assert set(cases)=={'passive_control','safety_valley','repeated_trade_opportunities'}
          for label, case in cases.items():
              assert len(case['input']['original_hourly'])==72, label
              assert len(case['input']['native_quarters'])==288, label
              assert case['native_plan72']['plan']['execution_enabled'] is False
              assert case['native_plan72']['plan']['physical_execution_authority'] is False
              assert case['native_plan72']['plan']['slot_count']==288
          print('Full-chain strategy evidence produced; differing hourly/quarterly projections remain visible, not falsely declared equal.')
          PY
      - name: Preserve complete source/native quarter-price comparison
        if: always() && github.ref_name == 'doems3-h8-contiguous-quarter-allocation'
        uses: actions/upload-artifact@v4
        with:
          name: alpha84-contiguous-evidence-${{ matrix.python-version }}-${{ github.sha }}
          path: build/alpha84-active-fullchain.json
          if-no-files-found: warn
      - name: Produce Alpha84 baseline recovery differential evidence (diagnostic only)
        if: github.ref_name == 'doems3-h5-h8-anker84-baseline-correction'
        run: |
          python scripts/verify_alpha84_repaired_chain.py --output build/alpha84-h5-h8-recovery.json
          python - <<'PY'
          import json
          cases = json.load(open('build/alpha84-h5-h8-recovery.json'))['cases']
          for name, case in cases.items():
              diagnostic = case['diagnostic']
              grouped = diagnostic['hourly_source_differences_by_field_group']
              print('CASE', name, 'source-vs-hour', diagnostic['hourly_source_difference_count'],
                    'source-vs-physical', diagnostic['source_native_difference_count'])
              for category, entries in grouped.items():
                  print('CATEGORY', category, 'count', len(entries))
                  for entry in entries[:12]:
                      print('DIFF', name, category, json.dumps(entry, sort_keys=True))
              print('TOTALS', name, 'original', json.dumps(case['alpha84']['totals'], sort_keys=True),
                    'quarter', json.dumps(case['source_quarter']['totals'], sort_keys=True))
          assert set(cases) == {'passive_control', 'safety_valley', 'repeated_trade_opportunities'}
          PY
      - name: Preserve Alpha84 H5-H8 complete diagnostic artifact
        if: always() && github.ref_name == 'doems3-h5-h8-anker84-baseline-correction'
        uses: actions/upload-artifact@v4
        with:
          name: alpha84-h5-h8-recovery-${{ matrix.python-version }}-${{ github.sha }}
          path: build/alpha84-h5-h8-recovery.json
          if-no-files-found: warn
      - name: Package exact tested source without publication
        if: matrix.python-version == '3.13'
        run: python scripts/build_scheduler_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-${{ matrix.python-version }}-${{ github.sha }}
          path: build/
          if-no-files-found: error
