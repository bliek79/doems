name: DOEMS 3.0 Alpha 4.3 - Validate and publish
on:
  push:
    branches:
      - doems3-publish-alpha-4-3

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q custom_components/doems
      - run: pytest -q
      - name: Validate JSON and public version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/doems/manifest.json").read_text())
          assert manifest["version"] == "0.3.0-alpha.4.3"
          assert 'VERSION = "0.3.0-alpha.4.3"' in Path("custom_components/doems/const.py").read_text()
          for file in Path("custom_components/doems").rglob("*.json"):
              json.loads(file.read_text())
          assert Path("custom_components/doems/energy_need.py").is_file()
          assert Path("custom_components/doems/energy_need_runtime.py").is_file()
          PY

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm tag and release do not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/"$GITHUB_REPOSITORY"/git/ref/tags/v0.3.0-alpha.4.3 >/dev/null 2>&1; then
            echo "Ref already exists; refusing to change it"
            exit 1
          fi
          if gh release view v0.3.0-alpha.4.3 >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it"
            exit 1
          fi
      - name: Build HACS archive and checksum
        run: |
          zip -q -r doems.zip custom_components/doems examples LICENSE README.md hacs.json RELEASE_NOTES_v0.3.0-alpha.4.3.md
          sha256sum doems.zip > SHA256SUMS.txt
          unzip -t doems.zip
      - name: Create pre-release on exact tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0-alpha.4.3 doems.zip SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "DOEMS 3.0 - Alpha 4.3 - Energy Need" --notes-file RELEASE_NOTES_v0.3.0-alpha.4.3.md
