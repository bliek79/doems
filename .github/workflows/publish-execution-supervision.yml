name: Publish validated execution supervision
on:
  push:
    branches: [release-execution-supervision-20261018]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio homeassistant
      - name: Full validation
        run: |
          python -m compileall -q custom_components/doems
          python -m pytest -q
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path("custom_components/doems").rglob("*.json"):
              json.loads(p.read_text())
          from custom_components.doems.const import VERSION
          assert VERSION == "0.2.0-alpha.8.0.5"
          assert json.loads(Path("custom_components/doems/manifest.json").read_text())["version"] == VERSION
          PY
      - name: Package
        run: |
          zip -r doems.zip custom_components/doems examples LICENSE README.md hacs.json RELEASE_NOTES_0.2.0-alpha.8.0.5.md
          unzip -t doems.zip
          sha256sum doems.zip > SHA256SUMS.txt
      - name: Publish tested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 0.2.0-alpha.8.0.5 doems.zip SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "DOEMS 0.2.0-alpha.8.0.5 - Execution supervision" --notes-file RELEASE_NOTES_0.2.0-alpha.8.0.5.md
