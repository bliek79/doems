name: DOEMS 3.0 Chapter 7 validation and publication

on:
  push:
    branches:
      - doems3-ch7-plan-store-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q custom_components/doems scripts
      - run: python -m pytest -q --junitxml=build/test-results.xml
      - run: python scripts/validate_plan_store_release.py
      - name: Package exact tested source
        if: matrix.python-version == '3.13'
        run: python scripts/build_plan_store_release.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: plan-store-${{ github.sha }}
          path: build/
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/doems3-ch7-plan-store-implementation'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: plan-store-${{ github.sha }}
          path: build/
      - name: Publish approved register and tested new prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_plan_store_release.py
