name: P2 Alpha82 battery parity validation
on:
  pull_request:
    paths:
      - 'custom_components/doems/**'
      - 'tests/test_p2_alpha82_policy.py'
      - 'tests/test_execution_controller.py'
      - 'tests/test_recovery_battery_chain.py'
      - '.github/workflows/p2-alpha82-validation.yml'
  workflow_dispatch:
jobs:
  battery-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile integration
        run: python -m compileall -q custom_components/doems
      - name: Run P2 and battery-chain regression tests
        run: python -m pytest -q tests/test_p2_alpha82_policy.py tests/test_execution_controller.py tests/test_recovery_battery_chain.py
