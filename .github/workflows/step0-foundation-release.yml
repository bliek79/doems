name: Step 0 Foundation CI and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Compile integration
        run: python -m compileall -q custom_components/doems

      - name: Run foundation contract tests
        run: pytest -q tests/test_foundation_contract.py

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/doems').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid: {path}')
          PY

  publish-alpha1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release archive
        run: |
          zip -r doems.zip custom_components/doems LICENSE README.md hacs.json RELEASE_NOTES_0.1.0-alpha.1.md
          sha256sum doems.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish prerelease if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view 0.1.0-alpha.1 >/dev/null 2>&1; then
            echo "Release 0.1.0-alpha.1 already exists; leaving it unchanged."
          else
            gh release create 0.1.0-alpha.1 \
              doems.zip SHA256SUMS.txt \
              --target main \
              --prerelease \
              --title "DOEMS 0.1.0-alpha.1 - Step 0 Clean Foundation" \
              --notes-file RELEASE_NOTES_0.1.0-alpha.1.md
          fi
