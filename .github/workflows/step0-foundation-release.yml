name: Foundation Regression CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q custom_components/doems
      - run: pytest -q tests/test_foundation_contract.py
      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('custom_components/doems').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid: {path}')
          PY
