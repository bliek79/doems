name: Publish R8-A readiness prerelease
on:
  push:
    branches:
      - release-r8a-20261017
    paths:
      - .github/workflows/publish-r8a-20261017.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved R8-A merge
        uses: actions/checkout@v4
        with:
          ref: 9cd50922ab85afda834f8d937f92eb5428718c10
      - name: Verify exact R8-A source
        run: |
          test "$(git rev-parse HEAD)" = "9cd50922ab85afda834f8d937f92eb5428718c10"
          test -f custom_components/doems/ems_execution_readiness.py
          test -f tests/test_r8a_execution_readiness.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate R8-A
        run: |
          python -m pip install pytest
          python -m compileall -q custom_components/doems
          pytest -q tests/test_r8a_execution_readiness.py
      - name: Package approved source
        run: |
          zip -r doems.zip custom_components/doems examples LICENSE README.md hacs.json
          sha256sum doems.zip > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > R8A_RELEASE_NOTES.md <<'EOF'
          # DOEMS R8-A - Non-actuating Execution Readiness Validation

          R8-A adds a fail-closed readiness validator and contract tests for existing R7 plan handoff snapshots.

          - Checks pending plan status, slot selection, scheduler readiness, plan revision/identity, safety, prestart, final revalidation, controller conflict, start window and parameters.
          - Returns blockers and evidence; does not execute actions or control the battery.
          - New module: custom_components/doems/ems_execution_readiness.py; tests: tests/test_r8a_execution_readiness.py.
          - This module is not wired into the runtime. R8-B physical execution is out of scope and requires separate approval.
          - Native forecast architecture remains 15 minutes / 72 hours / 288 slots; R0-R6 frozen.
          - Based on merged PR #94, commit 9cd50922ab85afda834f8d937f92eb5428718c10.
          - Integration manifest version remains 0.1.0-alpha.40; this is a source milestone prerelease, not an installed runtime version bump.

          Validation: R8-A contract tests and compilation must pass before publication.
          EOF
          TAG="0.2.0-alpha.8.0.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing overwrite"
            exit 1
          fi
          gh release create "$TAG" doems.zip SHA256SUMS.txt --target 9cd50922ab85afda834f8d937f92eb5428718c10 --title "DOEMS 0.2.0-alpha.8.0.1 - R8-A Readiness Validation" --notes-file R8A_RELEASE_NOTES.md --prerelease
