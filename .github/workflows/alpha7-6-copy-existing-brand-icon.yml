name: Alpha7.6 Copy Existing Brand Icon

on:
  push:
    branches: [alpha7-6-exact-existing-brand-icon]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-brand-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: alpha7-6-exact-existing-brand-icon
      - name: Copy exact existing Dummy OS brand icon
        run: |
          rm -rf custom_components/doems/brand
          mkdir -p custom_components/doems/brand
          curl -fsSL https://raw.githubusercontent.com/bliek79/dummy-os-energy/main/custom_components/dummy_os_data/brand/icon.png -o custom_components/doems/brand/icon.png
          test "$(git hash-object custom_components/doems/brand/icon.png)" = "fb0dd2dee9b6c7074da8bdde0f5663260677c779"
          rm -f scripts/build_brand_assets.py
      - name: Commit exact icon and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A custom_components/doems/brand scripts/build_brand_assets.py
          if git diff --cached --quiet; then
            echo "Exact existing brand icon already present."
            exit 0
          fi
          git commit -m "Alpha7.6: copy exact existing Dummy OS brand icon"
          git push origin HEAD:alpha7-6-exact-existing-brand-icon
