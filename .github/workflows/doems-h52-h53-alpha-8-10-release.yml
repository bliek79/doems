name: DOEMS 3.0 H5.2 + H5.3 Alpha84 safe release
on:
  push:
    branches:
      - doems3-publish-alpha-8-10-h52-h53
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -m compileall -q custom_components/doems scripts tests
      - run: python -m pytest -q --junitxml=build/test-results.xml
      - name: Enforce original Alpha84 strategy and source locks
        run: python scripts/validate_scheduler_release.py
      - name: Hard gate H5.1 + H5.2 + H5.3 source and physical separation
        run: |
          python -m pytest -q tests/test_h51_release_parity.py tests/test_h52_safety_timing.py tests/test_h53_soc_resolution.py tests/test_alpha84_planning_port.py tests/test_alpha84_bridge_port.py tests/test_alpha84_contiguous_quarter_selection.py
      - name: Produce immutable tested package and SHA256 provenance
        if: matrix.python-version == '3.13'
        run: python scripts/build_scheduler_release.py
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: h52-h53-package-${{ github.sha }}
          path: build/
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/doems3-publish-alpha-8-10-h52-h53'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: h52-h53-package-${{ github.sha }}
          path: build/
      - name: Publish immutable new prerelease only after all checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_h52_h53_release.py
