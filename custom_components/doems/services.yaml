schedule_plan:
  name: Plan inplannen
  description: >-
    Zet een handmatig DOEMS-plan expliciet op gepland en maakt het beschikbaar
    voor de Scheduler. De starttijd moet geldig en in de toekomst zijn.
    Deze service voert geen fysieke batterijactie uit.
  fields:
    slot:
      name: Planplaats
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 3
          step: 1
          mode: box

cancel_plan:
  name: Plan annuleren
  description: >-
    Annuleer de gekozen handmatige DOEMS-planplaats. Deze Alpha8-service
    wijzigt alleen de plan-lifecycle en voert geen fysieke batterijactie uit.
  fields:
    slot:
      name: Planplaats
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 3
          step: 1
          mode: box
